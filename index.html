<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Analysis Lab</title>
  <script src="https://lib.imjoy.io/imjoy-loader.js"></script>
</head>

<body>
  <h3>Image Analysis Lab</h3>
  <div id="imjoy-container" style="height: 500px; border: 1px solid #ccc;"></div>

  <script>
    window.onload = async () => {
  try {
    // Carica l'applicazione ImJoy Core
    const imjoy = await imjoyLoader.loadImJoy({
      config: {
        theme: "light",
        full_screen: false
      }
    });

    // Inizializza e avvia il container con i plugin
    await imjoy.start({
      container: "#imjoy",
      menu_style: { position: "top" },
      plugins: [
        "plugins/analysis.imjoy.html"
      ]
    });
    
    console.log("ImJoy caricato con successo!");
  } catch (e) {
    console.error("Errore nel caricamento di ImJoy:", e);
  }
};
  </script>
</body>
</html>
