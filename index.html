<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Image Analysis Lab</title>
  <script src="https://lib.imjoy.io/imjoy-loader.js"></script>
</head>

<body>
  <h3>Image Analysis Lab</h3>
  <div id="imjoy" style="width: 100%; height: 600px;"></div>

  <script>
    window.onload = async () => {
      try {
        // Tentativo di caricamento usando il pattern universale
        // Se imjoyLoader.loadImJoy non esiste, proviamo a chiamare direttamente loadImJoy
        const loader = window.imjoyLoader || {};
        const loadFn = loader.loadImJoy || window.loadImJoy;

        if (typeof loadFn !== 'function') {
          throw new Error("ImJoy Loader non è stato caricato correttamente o l'API è cambiata.");
        }

        const imjoy = await loadFn({
          config: {
            theme: "light"
          }
        });

        await imjoy.start({
          container: "#imjoy",
          menu_style: { position: "top" },
          plugins: [
            "plugins/analysis.imjoy.html"
          ]
        });

        console.log("ImJoy avviato con successo");
      } catch (e) {
        console.error("Errore critico:", e);
        document.body.innerHTML += `<p style="color:red">Errore: ${e.message}</p>`;
      }
    };
  </script>
</body>
</html>
