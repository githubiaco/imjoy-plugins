<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Analysis Lab</title>
  <script src="https://lib.imjoy.io/imjoy-loader.js"></script>
</head>
<body>
  <h3>Image Analysis Lab</h3>
  <div id="imjoy-container" style="height: 500px; border: 1px solid #ccc;"></div>
  <script>
    window.onload = async () => {
      try {
        const app = await loadImJoyBasicApp({
          process_url_query: false,
          show_window_title: true,
          show_progress_bar: true,
          show_empty_window: true,
          menu_style: { position: "top", right: 0, top: "2px" },
          window_style: { width: '100%', height: '100%' },
          main_container: "imjoy-container", // Corretto l'ID per corrispondere al div
          menu_container: null,
          window_manager_container: null,
          imjoy_api: {},
          theme: "light"
        });
        await app.loadPlugin("plugins/analysis.imjoy.html");
        console.log("ImJoy avviato con successo");
      } catch (e) {
        console.error("Errore critico:", e);
        document.body.innerHTML += `<p style="color:red">Errore: ${e.message}</p>`;
      }
    };
  </script>
</body>
</html>
