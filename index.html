<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Analysis Lab</title>
  <script src="https://lib.imjoy.io/imjoy-loader.js"></script>
  <style>
    body { margin: 0; padding: 10px; font-family: Arial, sans-serif; }
    #imjoy-menu { height: 40px; border-bottom: 1px solid #ccc; background: #f8f8f8; }
    #imjoy-windows { height: auto; border: 1px solid #ccc; margin-top: 10px; } /* Changed to 'auto' to avoid modal warning */
  </style>
</head>
<body>
  <h3>Image Analysis Lab</h3>

  <!-- Container per il menu -->
  <div id="imjoy-menu"></div>

  <!-- Container principale per le finestre/plugin -->
  <div id="imjoy-windows"></div>

  <script>
    window.onload = async () => {
      try {
        const app = await loadImJoyBasicApp({
          process_url_query: false,
          show_window_title: true,
          show_progress_bar: true,
          show_empty_window: false,  // Disable empty window to avoid modal issues
          hide_about_imjoy: false,
          menu_style: { 
            position: "absolute", 
            right: "10px", 
            top: "8px",
            zIndex: 100 
          },
          window_style: { width: '100%', height: '100%' },
          
          // Configurazione con container separati
          main_container: null,
          menu_container: "imjoy-menu",
          window_manager_container: "imjoy-windows",

          imjoy_api: {},
          theme: "light"
        });

        // Carica il plugin con URL assoluto (risolve l'errore di repository)
        const pluginUrl = location.origin + "/plugins/analysis.imjoy.html";
        await app.loadPlugin(pluginUrl);

        console.log("✅ ImJoy avviato con successo");
      } catch (e) {
        console.error("❌ Errore critico:", e);
        document.body.innerHTML += `<p style="color:red; margin-top:20px;">Errore: ${e.message}</p>`;
      }
    };
  </script>
</body>
</html>
